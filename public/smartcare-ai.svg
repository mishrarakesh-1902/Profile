<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070c18"/>
      <stop offset="0.5" stop-color="#0b162c"/>
      <stop offset="1" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="glow" x1="200" y1="100" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#4facfe" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6b11ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="radial" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#bg)"/>
  <rect width="1200" height="750" fill="url(#radial)"/>

  <!-- Grid mesh -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 150 L 1200 150 M 0 300 L 1200 300 M 0 450 L 1200 450 M 0 600 L 1200 600" />
    <path d="M 200 0 L 200 750 M 400 0 L 400 750 M 600 0 L 600 750 M 800 0 L 800 750 M 1000 0 L 1000 750" />
  </g>

  <!-- Glowing Orb Backdrop -->
  <circle cx="850" cy="350" r="260" fill="url(#glow)" filter="blur(60px)"/>

  <!-- Glass Card mockup -->
  <g transform="translate(100, 100)">
    <rect width="1000" height="550" rx="24" fill="#0d1527" fill-opacity="0.75" stroke="#1e293b" stroke-width="2"/>
    <rect width="1000" height="550" rx="24" fill="none" stroke="url(#accent)" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="1000" height="60" rx="24" fill="#0f172a" fill-opacity="0.9"/>
    <circle cx="36" cy="30" r="6" fill="#ef4444"/>
    <circle cx="56" cy="30" r="6" fill="#f59e0b"/>
    <circle cx="76" cy="30" r="6" fill="#10b981"/>

    <!-- URL pill -->
    <rect x="120" y="16" width="360" height="28" rx="14" fill="#1e293b" fill-opacity="0.8"/>
    <text x="140" y="35" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500">smartcare-commerce-ai.preview</text>

    <!-- Badge -->
    <rect x="830" y="18" width="130" height="24" rx="12" fill="#0284c7" fill-opacity="0.25"/>
    <text x="895" y="34" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AI-NATIVE ENGINE</text>

    <!-- Content inside Card -->
    <!-- Left column: Big Title & Stats -->
    <text x="60" y="140" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3">INTELLIGENT HEALTHCARE COMMERCE</text>
    <text x="60" y="200" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">SmartCare Commerce AI</text>
    <text x="60" y="245" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="400">Next-gen commerce engine powered by LLMs, automated diagnostics,</text>
    <text x="60" y="272" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="400">real-time inventory prediction &amp; intelligent conversational checkout.</text>

    <!-- Tags -->
    <g transform="translate(60, 310)">
      <rect width="110" height="32" rx="8" fill="#1e293b"/>
      <text x="55" y="21" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">LLMs &amp; RAG</text>

      <rect x="122" width="90" height="32" rx="8" fill="#1e293b"/>
      <text x="167" y="21" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">Node.js</text>

      <rect x="224" width="90" height="32" rx="8" fill="#1e293b"/>
      <text x="269" y="21" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">Python</text>

      <rect x="326" width="120" height="32" rx="8" fill="#1e293b"/>
      <text x="386" y="21" fill="#cbd5e1" font-family="monospace" font-size="12" text-anchor="middle">Vector Search</text>
    </g>

    <!-- Right Side Dashboard Graphic -->
    <g transform="translate(560, 100)">
      <rect width="380" height="390" rx="16" fill="#080e1e" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Mini Chart -->
      <path d="M 30 240 Q 90 180, 150 200 T 270 120 T 350 80" fill="none" stroke="#38bdf8" stroke-width="3"/>
      <path d="M 30 240 Q 90 180, 150 200 T 270 120 T 350 80 L 350 340 L 30 340 Z" fill="url(#accent)" fill-opacity="0.1"/>

      <text x="30" y="45" fill="#f8fafc" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="600">Model Inference &amp; Predictions</text>
      <text x="30" y="70" fill="#64748b" font-family="-apple-system, system-ui, sans-serif" font-size="11">Real-time health token analytics</text>

      <!-- Stat boxes -->
      <rect x="30" y="260" width="150" height="70" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="45" y="285" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600">ACCURACY</text>
      <text x="45" y="315" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800">99.4%</text>

      <rect x="200" y="260" width="150" height="70" rx="10" fill="#0f172a" stroke="#1e293b"/>
      <text x="215" y="285" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="600">LATENCY</text>
      <text x="215" y="315" fill="#10b981" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800">&lt; 85ms</text>
    </g>
  </g>
</svg>
