<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_fm" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08140e"/>
      <stop offset="0.5" stop-color="#0f2319"/>
      <stop offset="1" stop-color="#060f0a"/>
    </linearGradient>
    <radialGradient id="radial_fm" cx="55%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent_fm" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#10b981"/>
      <stop offset="1" stop-color="#84cc16"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" fill="url(#bg_fm)"/>
  <rect width="1200" height="750" fill="url(#radial_fm)"/>

  <!-- Organic topographic curves -->
  <g opacity="0.12" stroke="#10b981" stroke-width="1.5">
    <ellipse cx="600" cy="400" rx="450" ry="250"/>
    <ellipse cx="600" cy="400" rx="350" ry="180"/>
    <ellipse cx="600" cy="400" rx="250" ry="110"/>
  </g>

  <!-- Glass Card mockup -->
  <g transform="translate(100, 100)">
    <rect width="1000" height="550" rx="24" fill="#0d1f15" fill-opacity="0.8" stroke="#1b3827" stroke-width="2"/>
    <rect width="1000" height="550" rx="24" fill="none" stroke="url(#accent_fm)" stroke-opacity="0.45" stroke-width="1.5"/>

    <!-- Header bar -->
    <rect width="1000" height="60" rx="24" fill="#11291d" fill-opacity="0.9"/>
    <circle cx="36" cy="30" r="6" fill="#ef4444"/>
    <circle cx="56" cy="30" r="6" fill="#f59e0b"/>
    <circle cx="76" cy="30" r="6" fill="#10b981"/>

    <!-- URL pill -->
    <rect x="120" y="16" width="370" height="28" rx="14" fill="#193a28" fill-opacity="0.8"/>
    <text x="140" y="35" fill="#6ee7b7" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="500">farm-market-project.onrender.com</text>

    <!-- Badge -->
    <rect x="800" y="18" width="160" height="24" rx="12" fill="#10b981" fill-opacity="0.25"/>
    <text x="880" y="34" fill="#34d399" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">AGRI-TECH COMMERCE</text>

    <!-- Left column -->
    <text x="60" y="140" fill="#34d399" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3">FARMER &amp; BUYER ECOSYSTEM</text>
    <text x="60" y="200" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Farm Market</text>
    <text x="60" y="245" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="400">Direct-to-consumer agricultural commerce platform connecting grassroots</text>
    <text x="60" y="272" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="400">farmers directly with commercial buyers, eliminating intermediaries &amp; middlemen.</text>

    <!-- Tags -->
    <g transform="translate(60, 310)">
      <rect width="115" height="32" rx="8" fill="#193928"/>
      <text x="57" y="21" fill="#a7f3d0" font-family="monospace" font-size="12" text-anchor="middle">Full-Stack</text>

      <rect x="127" width="95" height="32" rx="8" fill="#193928"/>
      <text x="174" y="21" fill="#a7f3d0" font-family="monospace" font-size="12" text-anchor="middle">Node.js</text>

      <rect x="234" width="105" height="32" rx="8" fill="#193928"/>
      <text x="286" y="21" fill="#a7f3d0" font-family="monospace" font-size="12" text-anchor="middle">MongoDB</text>

      <rect x="351" width="125" height="32" rx="8" fill="#193928"/>
      <text x="413" y="21" fill="#a7f3d0" font-family="monospace" font-size="12" text-anchor="middle">Marketplace</text>
    </g>

    <!-- Right Side Agricultural Marketplace Mockup -->
    <g transform="translate(560, 95)">
      <rect width="380" height="400" rx="16" fill="#0c1b12" stroke="#1b3827" stroke-width="1.5"/>

      <!-- Produce Showcase Items -->
      <g transform="translate(20, 20)">
        <rect width="340" height="90" rx="12" fill="#142b1e" stroke="#234a33"/>
        <rect x="15" y="15" width="60" height="60" rx="10" fill="#10b981" fill-opacity="0.25"/>
        <text x="45" y="52" fill="#34d399" font-family="-apple-system, system-ui, sans-serif" font-size="24" text-anchor="middle">🌾</text>
        <text x="90" y="42" fill="#f0fdf4" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="700">Organic Harvest Grains</text>
        <text x="90" y="65" fill="#34d399" font-family="monospace" font-size="13">Direct from Punjab • Verified Farm</text>
      </g>

      <g transform="translate(20, 125)">
        <rect width="340" height="90" rx="12" fill="#142b1e" stroke="#234a33"/>
        <rect x="15" y="15" width="60" height="60" rx="10" fill="#84cc16" fill-opacity="0.25"/>
        <text x="45" y="52" fill="#a3e635" font-family="-apple-system, system-ui, sans-serif" font-size="24" text-anchor="middle">🍎</text>
        <text x="90" y="42" fill="#f0fdf4" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="700">Fresh Produce &amp; Orchards</text>
        <text x="90" y="65" fill="#a3e635" font-family="monospace" font-size="13">Zero Middlemen • Transparent Cost</text>
      </g>

      <!-- Fair Trade telemetry banner -->
      <g transform="translate(20, 235)">
        <rect width="340" height="135" rx="12" fill="#0d2116" stroke="#1e462f"/>
        <text x="25" y="38" fill="#86efac" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">COMMUNITY METRICS</text>
        <text x="25" y="72" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="26" font-weight="800">100% Direct Payout</text>
        <text x="25" y="102" fill="#9ca3af" font-family="-apple-system, system-ui, sans-serif" font-size="13">Empowering rural farmers with fair market reach.</text>
      </g>
    </g>
  </g>
</svg>
