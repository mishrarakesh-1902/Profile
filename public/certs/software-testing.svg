<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <linearGradient id="bg-grad-test" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1738" />
      <stop offset="45%" stop-color="#090d20" />
      <stop offset="100%" stop-color="#040610" />
    </linearGradient>
    <radialGradient id="glow-test" cx="50%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#3b82f6" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="blue-grad-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="badge-blue-test" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="750" rx="28" fill="url(#bg-grad-test)" />
  <rect width="500" height="750" rx="28" fill="url(#glow-test)" />
  <rect width="498" height="748" x="1" y="1" rx="27" fill="none" stroke="url(#blue-grad-border)" stroke-width="1.5" />

  <!-- Inner Frame -->
  <rect x="24" y="24" width="452" height="702" rx="20" fill="none" stroke="rgba(96,165,250,0.18)" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Corner Accents -->
  <path d="M 36 50 L 36 36 L 50 36" fill="none" stroke="#60a5fa" stroke-width="2" />
  <path d="M 464 50 L 464 36 L 450 36" fill="none" stroke="#60a5fa" stroke-width="2" />
  <path d="M 36 700 L 36 714 L 50 714" fill="none" stroke="#60a5fa" stroke-width="2" />
  <path d="M 464 700 L 464 714 L 450 714" fill="none" stroke="#60a5fa" stroke-width="2" />

  <!-- Top Badge / Header -->
  <g transform="translate(250, 68)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="rgba(59,130,246,0.12)" stroke="rgba(96,165,250,0.3)" stroke-width="1" />
    <text text-anchor="middle" y="5" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">COURSERA CERTIFIED</text>
  </g>

  <!-- Center Emblem (Check / Test Suite) -->
  <g transform="translate(250, 185)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="none" stroke="rgba(96,165,250,0.2)" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="60" fill="#0b132b" stroke="url(#badge-blue-test)" stroke-width="2" />
    
    <!-- Checklist & Shield -->
    <rect x="-24" y="-22" width="48" height="44" rx="8" fill="rgba(59,130,246,0.2)" stroke="#60a5fa" stroke-width="2" />
    <path d="M -14 -10 L -6 -2 L 14 -18" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-14" y1="6" x2="14" y2="6" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
    <line x1="-14" y1="14" x2="6" y2="14" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Title Section -->
  <text x="250" y="295" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Software Testing</text>
  <text x="250" y="322" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5">QUALITY ASSURANCE &amp; AUTOMATION</text>

  <!-- Divider -->
  <line x1="160" y1="352" x2="340" y2="352" stroke="rgba(96,165,250,0.3)" stroke-width="1" />

  <!-- Recipient Info -->
  <text x="250" y="388" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2">AWARDED TO</text>
  <text x="250" y="420" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Rakesh Kumar</text>
  <text x="250" y="448" text-anchor="middle" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Issuer: Coursera Online</text>

  <!-- Competencies Box -->
  <g transform="translate(60, 476)">
    <rect width="380" height="154" rx="14" fill="rgba(11,19,43,0.7)" stroke="rgba(96,165,250,0.15)" stroke-width="1" />
    <text x="20" y="32" fill="#93c5fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">QA &amp; TESTING PROFICIENCIES</text>
    
    <g transform="translate(20, 52)">
      <rect width="165" height="26" rx="6" fill="rgba(96,165,250,0.1)" />
      <text x="82" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Unit &amp; Integration Testing</text>

      <rect x="175" width="165" height="26" rx="6" fill="rgba(96,165,250,0.1)" />
      <text x="257" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Automated Test Suites</text>
    </g>

    <g transform="translate(20, 86)">
      <rect width="160" height="26" rx="6" fill="rgba(96,165,250,0.1)" />
      <text x="80" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">TDD &amp; Regression Testing</text>

      <rect x="170" width="170" height="26" rx="6" fill="rgba(96,165,250,0.1)" />
      <text x="255" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">CI/CD Pipeline Validation</text>
    </g>

    <text x="190" y="138" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">CREDENTIAL ID: COURSERA-ST-RK</text>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(250, 678)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(59,130,246,0.15)" stroke="rgba(96,165,250,0.35)" stroke-width="1" />
    <circle cx="-116" cy="0" r="5" fill="#10b981" />
    <text x="-98" y="4" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">VERIFIED SOFTWARE TESTER</text>
  </g>
</svg>