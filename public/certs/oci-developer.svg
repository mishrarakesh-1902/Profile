<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <linearGradient id="bg-grad-oci" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#240f12" />
      <stop offset="45%" stop-color="#14080a" />
      <stop offset="100%" stop-color="#090304" />
    </linearGradient>
    <radialGradient id="glow-oci" cx="50%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#f43f5e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="red-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.75" />
      <stop offset="40%" stop-color="#fb7185" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="badge-red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="750" rx="28" fill="url(#bg-grad-oci)" />
  <rect width="500" height="750" rx="28" fill="url(#glow-oci)" />
  <rect width="498" height="748" x="1" y="1" rx="27" fill="none" stroke="url(#red-border)" stroke-width="1.5" />

  <!-- Inner Frame -->
  <rect x="24" y="24" width="452" height="702" rx="20" fill="none" stroke="rgba(244,63,94,0.18)" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Corner Accents -->
  <path d="M 36 50 L 36 36 L 50 36" fill="none" stroke="#f43f5e" stroke-width="2" />
  <path d="M 464 50 L 464 36 L 450 36" fill="none" stroke="#f43f5e" stroke-width="2" />
  <path d="M 36 700 L 36 714 L 50 714" fill="none" stroke="#f43f5e" stroke-width="2" />
  <path d="M 464 700 L 464 714 L 450 714" fill="none" stroke="#f43f5e" stroke-width="2" />

  <!-- Top Badge / Header -->
  <g transform="translate(250, 68)">
    <rect x="-120" y="-14" width="240" height="28" rx="14" fill="rgba(244,63,94,0.12)" stroke="rgba(244,63,94,0.3)" stroke-width="1" />
    <text text-anchor="middle" y="5" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">ORACLE CLOUD INFRASTRUCTURE</text>
  </g>

  <!-- Center Emblem (Shield / Hexagon) -->
  <g transform="translate(250, 185)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="none" stroke="rgba(244,63,94,0.2)" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="60" fill="#200a0d" stroke="url(#badge-red)" stroke-width="2" />
    
    <!-- Oracle Oval Ring Icon -->
    <rect x="-30" y="-16" width="60" height="32" rx="16" fill="none" stroke="#f43f5e" stroke-width="3" />
    <circle cx="0" cy="0" r="6" fill="#f43f5e" />
    
    <!-- Professional Ribbon -->
    <path d="M -16 28 L 0 20 L 16 28 L 0 36 Z" fill="#fb7185" />
  </g>

  <!-- Title Section -->
  <text x="250" y="295" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.5">Certified Developer</text>
  <text x="250" y="322" text-anchor="middle" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">PROFESSIONAL (2025)</text>

  <!-- Divider -->
  <line x1="160" y1="352" x2="340" y2="352" stroke="rgba(244,63,94,0.3)" stroke-width="1" />

  <!-- Recipient Info -->
  <text x="250" y="388" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2">AWARDED TO</text>
  <text x="250" y="420" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Rakesh Kumar</text>
  <text x="250" y="448" text-anchor="middle" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Issuer: Oracle University</text>

  <!-- Competencies Box -->
  <g transform="translate(60, 476)">
    <rect width="380" height="154" rx="14" fill="rgba(25,10,14,0.7)" stroke="rgba(244,63,94,0.15)" stroke-width="1" />
    <text x="20" y="32" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">CLOUD DEVELOPMENT PROFICIENCIES</text>
    
    <g transform="translate(20, 52)">
      <rect width="165" height="26" rx="6" fill="rgba(244,63,94,0.1)" />
      <text x="82" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Cloud-Native Microservices</text>

      <rect x="175" width="165" height="26" rx="6" fill="rgba(244,63,94,0.1)" />
      <text x="257" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Serverless &amp; OCI Functions</text>
    </g>

    <g transform="translate(20, 86)">
      <rect width="160" height="26" rx="6" fill="rgba(244,63,94,0.1)" />
      <text x="80" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Kubernetes (OKE) &amp; CI/CD</text>

      <rect x="170" width="170" height="26" rx="6" fill="rgba(244,63,94,0.1)" />
      <text x="255" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Autonomous Database &amp; IAM</text>
    </g>

    <text x="190" y="138" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">CREDENTIAL ID: OCI-DEV-PRO-2025</text>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(250, 678)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(244,63,94,0.15)" stroke="rgba(244,63,94,0.35)" stroke-width="1" />
    <circle cx="-116" cy="0" r="5" fill="#10b981" />
    <text x="-98" y="4" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">VERIFIED OCI PROFESSIONAL</text>
  </g>
</svg>