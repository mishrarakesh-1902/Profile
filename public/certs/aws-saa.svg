<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="45%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="45%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ff9900" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold-border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.7" />
      <stop offset="40%" stop-color="#ffb84d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff9900" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="750" rx="28" fill="url(#bg-grad)" />
  <rect width="500" height="750" rx="28" fill="url(#glow)" />
  <rect width="498" height="748" x="1" y="1" rx="27" fill="none" stroke="url(#gold-border)" stroke-width="1.5" />

  <!-- Inner Frame -->
  <rect x="24" y="24" width="452" height="702" rx="20" fill="none" stroke="rgba(255,153,0,0.18)" stroke-width="1" stroke-dasharray="6 4" />

  <!-- Corner Accents -->
  <path d="M 36 50 L 36 36 L 50 36" fill="none" stroke="#ff9900" stroke-width="2" />
  <path d="M 464 50 L 464 36 L 450 36" fill="none" stroke="#ff9900" stroke-width="2" />
  <path d="M 36 700 L 36 714 L 50 714" fill="none" stroke="#ff9900" stroke-width="2" />
  <path d="M 464 700 L 464 714 L 450 714" fill="none" stroke="#ff9900" stroke-width="2" />

  <!-- Top Badge / Header -->
  <g transform="translate(250, 68)">
    <rect x="-115" y="-14" width="230" height="28" rx="14" fill="rgba(255,153,0,0.12)" stroke="rgba(255,153,0,0.3)" stroke-width="1" />
    <text text-anchor="middle" y="5" fill="#ffb84d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">AWS CERTIFIED</text>
  </g>

  <!-- Center Emblem (Shield / Hexagon) -->
  <g transform="translate(250, 185)">
    <!-- Outer Glow Circle -->
    <circle r="72" fill="none" stroke="rgba(255,153,0,0.2)" stroke-width="1" stroke-dasharray="4 4" />
    <circle r="60" fill="#0f1929" stroke="url(#badge-grad)" stroke-width="2" />
    
    <!-- AWS Cube / Cloud Graphic -->
    <path d="M 0 -32 L 28 -16 L 28 16 L 0 32 L -28 16 L -28 -16 Z" fill="rgba(255,153,0,0.15)" stroke="#ff9900" stroke-width="2" />
    <path d="M 0 -32 L 0 32" stroke="#ff9900" stroke-width="1.5" opacity="0.6" />
    <path d="M 0 0 L 28 -16" stroke="#ff9900" stroke-width="1.5" opacity="0.6" />
    <path d="M 0 0 L -28 -16" stroke="#ff9900" stroke-width="1.5" opacity="0.6" />
    
    <!-- Star Check -->
    <circle cx="0" cy="0" r="10" fill="#ff9900" />
    <path d="M -4 0 L -1 3 L 5 -3" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title Section -->
  <text x="250" y="300" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">Solutions Architect</text>
  <text x="250" y="328" text-anchor="middle" fill="#ff9900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" letter-spacing="1.5">ASSOCIATE (SAA-C03)</text>

  <!-- Divider -->
  <line x1="160" y1="356" x2="340" y2="356" stroke="rgba(255,153,0,0.3)" stroke-width="1" />

  <!-- Recipient Info -->
  <text x="250" y="392" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2">AWARDED TO</text>
  <text x="250" y="424" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700">Rakesh Kumar</text>
  <text x="250" y="452" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Validation Year: 2026</text>

  <!-- Competencies Box -->
  <g transform="translate(60, 480)">
    <rect width="380" height="150" rx="14" fill="rgba(15,23,42,0.7)" stroke="rgba(255,153,0,0.15)" stroke-width="1" />
    <text x="20" y="32" fill="#ffb84d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">VERIFIED DOMAIN SKILLS</text>
    
    <g transform="translate(20, 52)">
      <rect width="160" height="26" rx="6" fill="rgba(255,153,0,0.1)" />
      <text x="80" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">High Availability Architectures</text>

      <rect x="170" width="170" height="26" rx="6" fill="rgba(255,153,0,0.1)" />
      <text x="255" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">Cost &amp; Performance Tuning</text>
    </g>

    <g transform="translate(20, 86)">
      <rect width="150" height="26" rx="6" fill="rgba(255,153,0,0.1)" />
      <text x="75" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">VPC • Subnets • Routing</text>

      <rect x="160" width="180" height="26" rx="6" fill="rgba(255,153,0,0.1)" />
      <text x="250" y="17" text-anchor="middle" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11">S3 • EC2 • RDS • IAM Policy</text>
    </g>

    <text x="190" y="136" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="10">CREDENTIAL ID: AWS-SAA-2026-RK</text>
  </g>

  <!-- Bottom Verification Footer -->
  <g transform="translate(250, 678)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="rgba(255,153,0,0.15)" stroke="rgba(255,153,0,0.35)" stroke-width="1" />
    <circle cx="-116" cy="0" r="5" fill="#10b981" />
    <text x="-98" y="4" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">VERIFIED CLOUD ARCHITECT</text>
  </g>
</svg>